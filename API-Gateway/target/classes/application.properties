spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=exam-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://EXAM-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/exam-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=submission-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://SUBMISSION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/submission-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=evaluation-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://EVALUATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/evaluation-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1